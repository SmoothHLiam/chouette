# Chouette ! — one deploy puts the game and its sync API on the same origin.
#
# Step by step, see DEPLOY.md. The short version, run from this folder:
#
#   npx wrangler login
#   npx wrangler kv namespace create CHOUETTE
#     → paste the printed id below, replacing PASTE_YOUR_KV_NAMESPACE_ID_HERE
#   npx wrangler deploy

name = "chouette"
main = "index.mjs"
compatibility_date = "2026-01-01"

# The game's files live one level up. Anything listed in ../.assetsignore
# (this folder, the tests, the local dev server) is left out of the upload.
[assets]
directory = "../"
binding = "ASSETS"
# Static files answer every other path directly; /api/* always runs the Worker.
run_worker_first = ["/api/*"]

# Teacher sign-in. This is the project id from the Firebase console, which is
# public (the browser sends it on every sign-in) — a var, not a secret. Leave
# it empty and the API ignores accounts entirely, falling back to the device
# tokens classes have always used.
[vars]
FIREBASE_PROJECT_ID = "chouette-d1106"

# Created by: npx wrangler kv namespace create CHOUETTE
[[kv_namespaces]]
binding = "CHOUETTE"
id = "aa35885ade6840a6858d89b77e8f6aa0"
